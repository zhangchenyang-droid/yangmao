<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>羊毛小铺</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="羊毛小铺">
<meta name="theme-color" content="#bfe3f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0; height: 100%; overflow: hidden; background: #bfe3f2; color: #3a2a1a;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        user-select: none; -webkit-user-select: none;
    }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    .hud {
        position: fixed; top: 0; left: 0; right: 0; z-index: 6; pointer-events: none;
        display: flex; align-items: center; gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    }
    .hud > * { pointer-events: auto; }
    .pill {
        background: rgba(255, 255, 255, .9); border: 1px solid rgba(120, 90, 50, .2); border-radius: 999px;
        padding: 6px 11px; font-size: 14px; font-weight: 800; white-space: nowrap; box-shadow: 0 2px 0 rgba(120, 90, 50, .15);
    }
    .pill b { color: #c77a12; }
    .lvbar { display: inline-block; width: 46px; height: 7px; border-radius: 4px; background: #eadbbd; vertical-align: 1px; margin-left: 4px; overflow: hidden; }
    .lvbar i { display: block; height: 100%; background: #7cc46a; }
    .sp { flex: 1; }
    .btn {
        background: linear-gradient(#ffcf5a, #f0a020); color: #4a2a00; border: none; border-radius: 999px;
        padding: 7px 13px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit; white-space: nowrap;
        box-shadow: 0 3px 0 #b8700a, 0 5px 10px rgba(0, 0, 0, .15);
    }
    .btn.ghost { background: rgba(255, 255, 255, .92); color: #4a3418; box-shadow: 0 2px 0 rgba(120, 90, 50, .2); }
    .btn.small { padding: 5px 10px; font-size: 13px; }
    .btn:active { transform: translateY(2px); }
    .btn:disabled { opacity: .45; }
    .hidden { display: none !important; }
    /* 客人区 */
    .custs { position: fixed; left: 8px; right: 8px; z-index: 5; display: flex; gap: 8px; }
    .cust { flex: 1; min-width: 0; background: rgba(255, 252, 244, .95); border: 2px solid #f0d9a8; border-radius: 16px; padding: 6px 6px 7px;
        text-align: center; position: relative; cursor: pointer; transition: transform .15s, border-color .2s; min-height: 104px; }
    .cust.empty { background: rgba(255, 255, 255, .35); border-style: dashed; cursor: default; }
    .cust.ready { border-color: #6cc46a; box-shadow: 0 0 0 3px rgba(108, 196, 106, .35); animation: readyPulse 1s ease-in-out infinite; }
    @keyframes readyPulse { 50% { transform: translateY(-3px); } }
    .cust.vip { background: linear-gradient(#fff6d6, #ffe9a8); border-color: #e8b440; }
    .cust .face { font-size: 30px; line-height: 1.1; position: relative; }
    .cust .face small { position: absolute; top: -6px; right: 18%; font-size: 16px; }
    .cust .want { font-size: 12px; font-weight: 800; margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; overflow: hidden; }
    .cust .want .ic { font-size: 18px; }
    .cust .pay { font-size: 11px; font-weight: 800; color: #c77a12; }
    .cust .pat { height: 5px; border-radius: 3px; background: #eadbbd; margin: 4px 4px 0; overflow: hidden; }
    .cust .pat i { display: block; height: 100%; background: #7cc46a; transition: width .3s linear; }
    .cust.leave { animation: leave .5s forwards; }
    @keyframes leave { to { opacity: 0; transform: translateY(-20px) scale(.9); } }
    .cust.arrive { animation: arrive .5s cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes arrive { from { opacity: 0; transform: translateX(30px) scale(.8); } }
    /* 工坊 */
    .shop { position: fixed; left: 8px; right: 8px; z-index: 5; bottom: max(8px, env(safe-area-inset-bottom)); background: rgba(255, 250, 240, .97);
        border: 2px solid #f0d9a8; border-radius: 18px; padding: 8px 10px; box-shadow: 0 -4px 14px rgba(0, 0, 0, .08); }
    .shop .lab { font-size: 12px; font-weight: 800; opacity: .6; margin: 2px 2px 4px; display: flex; justify-content: space-between; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: flex; align-items: center; gap: 5px; background: #fff; border: 2px solid #ecdcbc; border-radius: 999px; padding: 3px 9px 3px 4px; font-size: 12px; font-weight: 800; cursor: pointer; }
    .chip.want { border-color: #6cc46a; }
    .dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .12); flex: none; display: inline-block; }
    .machines { display: flex; gap: 8px; margin: 6px 0; }
    .mach { flex: 1; background: #fff; border: 2px solid #ecdcbc; border-radius: 14px; padding: 6px 8px; cursor: pointer; position: relative; min-height: 62px; transition: transform .08s; }
    .mach.busy { border-color: #8ac0e8; }
    .mach.done { border-color: #6cc46a; animation: readyPulse 1s ease-in-out infinite; }
    .mach .t { font-size: 13px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
    .mach .s { font-size: 12px; font-weight: 700; opacity: .75; margin-top: 3px; min-height: 16px; }
    .mach .bar { height: 7px; border-radius: 4px; background: #eadbbd; margin-top: 5px; overflow: hidden; }
    .mach .bar i { display: block; height: 100%; background: #5aa0d8; }
    .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .opts button { background: #fff7e6; border: 2px solid #ecdcbc; border-radius: 12px; padding: 4px 8px; font-family: inherit; font-weight: 800; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; color: #3a2a1a; }
    .opts button.want { border-color: #6cc46a; background: #effae9; }
    .pop {
        position: fixed; z-index: 30; pointer-events: none; transform: translate(-50%, -50%); font-weight: 900; font-size: 20px;
        color: #e8453a; text-shadow: 0 2px 0 #fff; animation: pop 1.1s ease-out forwards; white-space: nowrap;
    }
    .pop.good { color: #3f9a4a; }
    .pop.long { white-space: normal; width: 86vw; text-align: center; font-size: 17px; line-height: 1.5; animation-duration: 2.6s; }
    .pop.gold { color: #d48a10; }
    @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } 30% { transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -150%); } }
    .card-bg { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(60, 90, 110, .35); }
    .card-bg.show { display: flex; animation: fade .3s; }
    @keyframes fade { from { opacity: 0; } }
    .card {
        width: min(88vw, 400px); max-height: 82vh; overflow: auto; padding: 16px; border-radius: 22px; text-align: center;
        background: #fffaf0; border: 3px solid #f0d9a8; box-shadow: 0 16px 40px rgba(0, 0, 0, .25);
        animation: cardIn .45s cubic-bezier(.3, 1.6, .5, 1); scrollbar-width: none;
    }
    .card::-webkit-scrollbar { display: none; }
    @keyframes cardIn { from { transform: scale(.6); opacity: 0; } }
    .card h2 { margin: 2px 0 6px; font-size: 20px; }
    .card .sub { font-size: 14px; line-height: 1.8; opacity: .9; }
    .card canvas { width: 70%; height: auto; display: block; margin: 0 auto; position: static; }
    .ctop { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; gap: 8px; margin: -4px -4px 4px 0; }
    .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; text-align: left; }
    .stat div { background: #fff; border-radius: 10px; padding: 6px 9px; font-size: 13px; font-weight: 700; box-shadow: 0 2px 0 #f0d9a8; }
    .stat div b { display: block; font-size: 11px; opacity: .55; }
    .growbar { height: 10px; border-radius: 5px; background: #eadbbd; overflow: hidden; margin: 6px 0; }
    .growbar i { display: block; height: 100%; background: #7cc46a; }
    .shopl { text-align: left; }
    .shopl .it { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 8px 10px; margin-bottom: 8px; box-shadow: 0 2px 0 #f0d9a8; }
    .shopl .it .e { font-size: 28px; }
    .shopl .it .x { flex: 1; font-size: 14px; font-weight: 800; }
    .shopl .it .x small { display: block; font-weight: 600; opacity: .65; font-size: 12px; }
    .shopl h3 { font-size: 15px; margin: 12px 2px 6px; }
    .stars { font-size: 24px; letter-spacing: 3px; }
    .hand { position: fixed; z-index: 15; font-size: 34px; pointer-events: none; transform: translate(-30%, 0); animation: handBob .8s ease-in-out infinite; filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
    @keyframes handBob { 50% { margin-top: 10px; } }
    .flow { display: flex; align-items: stretch; gap: 4px; }
    .flow .mach { min-height: 54px; padding: 5px 6px; cursor: default; }
    .flow .mach .t { font-size: 12px; }
    .flow .mach .s { font-size: 12px; display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
    .flow .arrow { align-self: center; font-size: 18px; font-weight: 900; opacity: .35; }
    .flow .dot { width: 13px; height: 13px; }
    .flyer { position: fixed; left: 0; top: 0; z-index: 14; pointer-events: none; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
    .puff { display: block; width: 20px; height: 16px; border-radius: 50%; background: currentColor; box-shadow: 7px -4px 0 -1px currentColor, -7px -3px 0 -2px currentColor, 0 0 0 1.5px rgba(120,90,50,.35); }
    .ball { display: block; width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), 0 0 0 1.5px rgba(120,90,50,.35); }
    .flow .mach .h { font-size: 10px; font-weight: 700; opacity: .5; margin-top: 1px; white-space: nowrap; }
    .flow .mach.busy:not(.knit) .ic { display: inline-block; animation: spinIc 1s linear infinite; }
    .flow .mach.knit .ic { display: inline-block; animation: knitIc .5s ease-in-out infinite; }
    @keyframes spinIc { to { transform: rotate(360deg); } }
    @keyframes knitIc { 50% { transform: rotate(-18deg) translateY(-2px); } }
    .tipb { position: fixed; z-index: 16; pointer-events: none; transform: translate(-50%, -100%); background: #3a2a1a; color: #fff; font-size: 13px; font-weight: 800;
        padding: 7px 11px; border-radius: 12px; white-space: nowrap; animation: tipIn .3s cubic-bezier(.3, 1.6, .5, 1); }
    .tipb::after { content: ''; position: absolute; left: var(--ax, 50%); bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #3a2a1a; }
    @keyframes tipIn { from { opacity: 0; transform: translate(-50%, -80%) scale(.8); } }
    /* 常驻目标 */
    .goal { position: fixed; left: 8px; right: 8px; z-index: 5; display: flex; align-items: center; gap: 7px; background: rgba(255, 255, 255, .92);
        border: 2px solid #f0d9a8; border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 13px; font-weight: 800; box-shadow: 0 2px 0 rgba(120, 90, 50, .12); }
    .goal .gt { white-space: nowrap; }
    .goal .gp { flex: 1; height: 8px; border-radius: 4px; background: #eadbbd; overflow: hidden; min-width: 30px; }
    .goal .gp i { display: block; height: 100%; background: #7cc46a; transition: width .3s; }
    .goal .gn { font-size: 12px; opacity: .7; white-space: nowrap; }
    .goal .gr { background: #fff3d6; border-radius: 999px; padding: 2px 8px; white-space: nowrap; font-size: 13px; }
    .goal.win { border-color: #6cc46a; background: #effae9; animation: goalWin .5s cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes goalWin { 40% { transform: scale(1.06); } }
    /* 大订单横幅 */
    .big { position: fixed; left: 8px; right: 8px; z-index: 5; }
    .bigo { display: flex; align-items: center; gap: 8px; background: linear-gradient(#fff1d0, #ffe2a0); border: 2px solid #e8b440; border-radius: 16px;
        padding: 6px 10px 9px; position: relative; overflow: hidden; cursor: pointer; animation: arrive .5s cubic-bezier(.3, 1.6, .5, 1); }
    .bigo.ready { border-color: #6cc46a; box-shadow: 0 0 0 3px rgba(108, 196, 106, .35); animation: readyPulse 1s ease-in-out infinite; }
    .bigo .bw { font-size: 28px; }
    .bigo .bx { flex: 1; font-size: 13px; font-weight: 800; line-height: 1.35; min-width: 0; }
    .bigo .bx small { display: block; font-size: 11px; opacity: .7; }
    .bigo .bc { font-size: 22px; text-align: center; line-height: 1; }
    .bigo .bc b { display: block; font-size: 13px; margin-top: 2px; }
    .bigo .bt { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0, 0, 0, .08); }
    .bigo .bt i { display: block; height: 100%; background: #e8a020; }
    .bigo .tl { font-size: 11px; font-weight: 800; color: #b8640a; }
    /* 商店有买得起的东西 */
    #shopBtn.glow { animation: shopGlow 1.2s ease-in-out infinite; position: relative; }
    #shopBtn.glow::after { content: ''; position: absolute; top: -2px; right: -2px; width: 11px; height: 11px; border-radius: 50%; background: #e8453a; border: 2px solid #fff; }
    @keyframes shopGlow { 50% { transform: scale(1.07); } }
    /* 图鉴 */
    .book { display: grid; grid-template-columns: 56px repeat(5, 1fr); gap: 5px; align-items: center; margin-top: 8px; }
    .book .rh { font-size: 12px; font-weight: 800; text-align: left; line-height: 1.2; }
    .book .rh small { display: block; font-size: 10px; opacity: .6; }
    .book .ch { font-size: 11px; font-weight: 800; opacity: .7; }
    .book .cell { aspect-ratio: 1; border-radius: 12px; background: #fff; box-shadow: 0 2px 0 #f0d9a8; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-size: 22px; }
    .book .cell.off { background: #f3ead8; box-shadow: none; font-size: 11px; font-weight: 800; color: #a08a6a; }
    .book .cell .ring { position: absolute; inset: 5px; border-radius: 50%; opacity: .55; }
    .book .cell span { position: relative; }
    .book .cell small { position: absolute; bottom: 1px; right: 4px; font-size: 10px; font-weight: 800; opacity: .6; }
    .book .done { grid-column: 1 / -1; font-size: 11px; font-weight: 800; color: #3f9a4a; text-align: right; margin-top: -2px; }
    .road .it.cur { box-shadow: 0 0 0 2px #7cc46a; }
    .road .it.lock { opacity: .55; }
    /* 营业日 */
    .day { position: fixed; left: 8px; right: 8px; z-index: 5; display: flex; align-items: center; gap: 7px; background: #fffaf0; border: 2px solid #f0d9a8;
        border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 800; white-space: nowrap; }
    .day.rush { background: linear-gradient(90deg, #ffe0b0, #ffc890); border-color: #f08a30; animation: shopGlow 1s ease-in-out infinite; }
    .day.closing { background: #e8eef8; border-color: #b8c8e0; }
    .day .db { flex: 1; height: 10px; border-radius: 5px; background: #eadbbd; position: relative; overflow: hidden; min-width: 40px; }
    .day .db i { display: block; height: 100%; background: linear-gradient(90deg, #f0b030, #f08a20); transition: width .3s; }
    .day .db u { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(90, 60, 20, .45); }
    .day .rep { color: #c77a12; }
    #waitPill.urgent { background: #ffe2dc; color: #c8302a; animation: shopGlow .8s ease-in-out infinite; }
    /* 剃毛调参面板 */
    .feel { position: fixed; left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); z-index: 22; background: rgba(40, 30, 20, .88); color: #fff;
        border-radius: 16px; padding: 8px 10px 10px; font-size: 12px; font-weight: 700; max-height: 40vh; display: flex; flex-direction: column; }
    .feel .fh { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .feel .fh b { flex: 1; font-size: 13px; }
    .feel .fh button { background: #ffcf5a; color: #4a2a00; border: none; border-radius: 999px; padding: 5px 9px; font: inherit; font-weight: 800; }
    .feel .fh button.g { background: rgba(255,255,255,.18); color: #fff; }
    .feel .fl { overflow: auto; display: grid; grid-template-columns: 1fr; gap: 4px; }
    .feel.min .fl { display: none; }
    .feel label { display: grid; grid-template-columns: 112px 1fr 46px; align-items: center; gap: 6px; }
    .feel label.ch span:first-child { color: #ffd060; }
    .feel input { width: 100%; accent-color: #ffcf5a; }
    .feel em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; }
    .confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 26; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
    <button class="btn ghost hidden" id="backBtn">‹ 牧场</button>
    <div class="pill" id="coinPill">💰 <b id="coins">0</b></div>
    <div class="pill" id="lvPill">小铺 Lv<b id="lv">1</b><span class="lvbar"><i id="lvbar"></i></span></div>
    <div class="pill hidden" id="qPill">⭐⭐⭐</div>
    <div class="pill hidden" id="waitPill"></div>
    <div class="sp"></div>
    <button class="btn ghost" id="bookBtn">📖</button>
    <button class="btn" id="shopBtn">商店</button>
</div>
<div class="day" id="day"></div>
<div class="goal" id="goal"></div>
<div class="big hidden" id="big"></div>
<div class="custs" id="custs"></div>
<div class="shop" id="shop"></div>
<div class="hand hidden" id="hand">👆</div>
<div class="feel hidden" id="feel"></div>
<div class="card-bg" id="cardBg"><div class="card" id="card"></div></div>

<script>
// ============================================================
// 基础
// ============================================================
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const $ = id => document.getElementById(id);
const cvs = $('c');
let ctx = cvs.getContext('2d');   // 牧场/状态卡的小图会临时把它指向离屏画布
let W = 0, H = 0, DPR = 1, U = 1, OX = 0, OY = 0, FLOOR = 0, TOP = 60;
function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cvs.width = W * DPR; cvs.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    TOP = document.querySelector('.hud').getBoundingClientRect().bottom;
    layoutTop();
    U = Math.min(W * 0.92, (H - TOP) * 0.7) / 330;
    OX = W / 2 - 10 * U; OY = TOP + (H - TOP) * 0.45; FLOOR = OY + 135 * U;
}
// 牧场的可用区域：客人区下面、工坊上面
function pasture() {
    const t = $('custs').getBoundingClientRect().bottom + 6, b = $('shop').getBoundingClientRect().top - 6;
    return { x: 0, y: t, w: W, h: Math.max(80, b - t) };
}

// ============================================================
// 声音
// ============================================================
let AC = null, NOISE = null, buzz = null;
function audio() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
    if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, dur, vol, type = 'sine', delay = 0, attack = 0.01, f1) {
    if (!AC) return;
    const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + attack); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, freq, vol, delay = 0, q = 1.2) {
    if (!AC) return;
    if (!NOISE) { NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const t0 = AC.currentTime + delay, src = AC.createBufferSource(), flt = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = NOISE; src.loop = true; flt.type = 'bandpass'; flt.frequency.value = freq; flt.Q.value = q;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt).connect(g).connect(AC.destination); src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
}
function buzzOn() {
    if (!AC || buzz) return;
    const o = AC.createOscillator(), o2 = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
    o.type = 'sawtooth'; o.frequency.value = 118; o2.type = 'square'; o2.frequency.value = 236;
    f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0;
    o.connect(f); o2.connect(f); f.connect(g).connect(AC.destination); o.start(); o2.start();
    buzz = { o, o2, f, g }; g.gain.setTargetAtTime(0.035, AC.currentTime, 0.03);
}
function buzzLevel(cutting, jam) {
    if (!buzz) return;

function showCard(html) { $('card').innerHTML = html; $('cardBg').classList.add('show'); }
function hideCard() { audio(); $('cardBg').classList.remove('show'); }
function popText(x, y, t, cls = '') { const el = document.createElement('div'); el.className = 'pop ' + cls + (t.length > 14 ? ' long' : ''); el.textContent = t; el.style.left = x + 'px'; el.style.top = y + 'px'; document.body.appendChild(el); setTimeout(() => el.remove(), t.length > 14 ? 2700 : 1200); }
function popAt(id, t, cls) { const el = $(id); if (!el || scene !== 'farm') return; const r = el.getBoundingClientRect(); popText(r.left + r.width / 2, r.top + r.height * 0.3, t, cls); }
// 升级礼花：左右下角喷出，阻力 + 重力，飘落、翻面，2.5 秒左右消失
function confetti() {
    const cv = document.createElement('canvas'); cv.className = 'confetti'; cv.width = W * DPR; cv.height = H * DPR; document.body.appendChild(cv);
    const g = cv.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const k = H / 800, cols = ['#ff5a7a', '#ffd34a', '#4ad6ff', '#7cff8a', '#b47bff', '#ff9a3c', '#ffffff'], ps = [];
    for (const side of [-1, 1]) for (let i = 0; i < 60; i++) {
        const ang = (side < 0 ? -62 : -118) * Math.PI / 180 + rand(-0.3, 0.3), sp = rand(1500, 2100) * k;
        ps.push({ x: side < 0 ? -10 : W + 10, y: H * 0.85, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, rot: rand(0, TAU), vr: rand(-8, 8), flip: rand(0, TAU), vf: rand(6, 14), sway: rand(0, TAU), w: rand(6, 10), h: rand(10, 15), c: cols[Math.floor(rand(0, cols.length))], t: 0, life: rand(2.2, 2.7) });
    }
    let last = performance.now();
    (function tick(now) {
        const dt = Math.min((now - last) / 1000, 0.05); last = now; g.clearRect(0, 0, W, H); let alive = 0;
        for (const p of ps) {
            p.t += dt; if (p.t > p.life) continue; alive++;
            if (p.vy < 0) { p.vy += 1200 * k * dt; const d = Math.exp(-1.5 * dt); p.vx *= d; p.vy *= d; }
            else { p.vy += (110 * k - p.vy) * Math.min(1, 4 * dt); p.vx *= Math.exp(-3 * dt); p.vx += Math.sin(p.t * 6 + p.sway) * 420 * k * dt; }
            p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.flip += p.vf * dt;
            g.globalAlpha = Math.min(1, (p.life - p.t) / 0.4); const c = Math.cos(p.flip);
            g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, c); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            if (c < 0) { g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); } g.restore();
        }
        if (alive) requestAnimationFrame(tick); else cv.remove();
    })(last);
}

function setClip(e) { clip.touch = e.pointerType === 'touch' || e.pointerType === 'pen'; clip.x = e.clientX; clip.y = e.clientY - (clip.touch ? FEEL.touchOff : 0); }
cvs.addEventListener('pointerdown', e => {
    audio(); tryFullscreen();
    if (scene === 'farm') { tapPasture(e.clientX, e.clientY); return; }
    if (!A) return;
    setClip(e);
    if (pluckBurr(clip.x, clip.y) || pluckBurr(e.clientX, e.clientY)) return;
    cvs.setPointerCapture(e.pointerId);
    clip.px = clip.x; clip.py = clip.y; clip.on = true; clip.down = true; clip.speed = 0;
    buzzOn();
});
cvs.addEventListener('pointermove', e => {
    if (scene !== 'shear') return;
    if (e.pointerType === 'mouse' && !clip.down) { setClip(e); clip.on = true; return; }
    if (clip.down) setClip(e);
});
const up = e => { clip.down = false; if (e.pointerType !== 'mouse') clip.on = false; buzzOff(); };
cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', up);
cvs.addEventListener('pointerleave', () => { clip.on = false; });
// 剃到一半不让走（不然毛白剃了）；剃完之前回牧场就当没剃
$('backBtn').onclick = () => { audio(); if (A && A.state !== 'shear' && A.state !== 'enter') return; exitShear(); };
$('shopBtn').onclick = shopCard;
$('bookBtn').onclick = bookCard;
$('lvPill').onclick = roadCard; $('lvPill').style.cursor = 'pointer';
$('cardBg').addEventListener('pointerdown', e => { if (e.target === $('cardBg') && !$('cBack') && !$('cGo') && !$('cNext')) hideCard(); });
// ---------- 剃毛调参面板：剃毛房间里连点顶上的星星 5 下 ----------
const FEEL_UI = [
    ['clipMul', '推子大小', 0.6, 2, 0.05], ['grab', '判定宽松', 0, 1.2, 0.05], ['tuftSize', '毛团大小', 1, 2.2, 0.05],
    ['flyX', '毛顺手势飞', 0, 0.4, 0.01], ['flyMax', '毛飞远上限', 200, 3000, 50], ['flyUp', '毛往上弹', 0, 500, 10], ['grav', '重力', 300, 2000, 50], ['touchOff', '推子离手指(px)', 0, 120, 2],
    ['nickSpeed', '推太快剪伤(px/s)', 1000, 6000, 100], ['wigMin', '扭动间隔·最短', 1, 8, 0.1], ['wigMax', '扭动间隔·最长', 1, 10, 0.1],
    ['warn', '「!」预警(秒)', 0.2, 1.5, 0.05], ['wigDur', '扭动时长(秒)', 0.2, 1, 0.05], ['nickPen', '剪伤扣星', 0, 1, 0.1],
    ['time', '限时(秒)', 6, 40, 1], ['comboGap', '连击断开(秒)', 0.2, 1.5, 0.05],
];
let feelOpen = false;
function openFeel() {
    feelOpen = true;
    const el = $('feel'); el.classList.remove('hidden', 'min');
    const fmt = (k, v) => (Number.isInteger(FEEL_UI.find(x => x[0] === k)[4]) ? v : (+v).toFixed(2));
    el.innerHTML = `<div class="fh"><b>手感<small style="display:block;font-size:10px;opacity:.6">计时已暂停</small></b><button class="g" id="fMin">收起</button><button class="g" id="fReset">恢复默认</button><button class="g" id="fCopy">复制数值</button><button id="fAgain">再来一只</button><button class="g" id="fClose">关</button></div>
        <div class="fl">${FEEL_UI.map(([k, n, a, b, st]) => `<label class="${FEEL[k] !== FEEL_DEF[k] ? 'ch' : ''}" data-k="${k}"><span>${n}</span><input type="range" min="${a}" max="${b}" step="${st}" value="${FEEL[k]}"><em>${fmt(k, FEEL[k])}</em></label>`).join('')}</div>`;
    el.querySelectorAll('label').forEach(l => {
        const k = l.dataset.k, inp = l.querySelector('input');
        inp.oninput = () => {
            FEEL[k] = +inp.value; l.querySelector('em').textContent = fmt(k, inp.value); l.classList.toggle('ch', FEEL[k] !== FEEL_DEF[k]);
            localStorage.setItem('shear_feel', JSON.stringify(FEEL));
            if (k === 'time' && A) { A.tmax = FEEL.time; A.time = Math.min(A.time, FEEL.time); }
        };
    });
    $('fMin').onclick = () => { el.classList.toggle('min'); $('fMin').textContent = el.classList.contains('min') ? '展开' : '收起'; };
    $('fClose').onclick = () => { el.classList.add('hidden'); feelOpen = false; };
    $('fReset').onclick = () => { FEEL = Object.assign({}, FEEL_DEF); localStorage.removeItem('shear_feel'); openFeel(); };
    $('fCopy').onclick = () => {
        const t = JSON.stringify(FEEL);
        (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => popText(W / 2, H * 0.3, '已复制，发给我就行', 'good')).catch(() => prompt('复制下面这行发给我', t));
    };
    // 毛团大小这类要重新生成才看得出来：直接换一只满毛的来试
    $('fAgain').onclick = () => { if (A && A.member) { const m = A.member; buzzOff(); enterShear(m); } };
}
let qTaps = [];
$('qPill').addEventListener('pointerdown', () => {
    const now = performance.now(); qTaps = qTaps.filter(t => now - t < 2000); qTaps.push(now);
    if (qTaps.length >= 5) { qTaps = []; feelOpen ? ($('feel').classList.add('hidden'), feelOpen = false) : openFeel(); }
});
let taps = [];
$('coinPill').addEventListener('pointerdown', () => {
    const now = performance.now(); taps = taps.filter(t => now - t < 2000); taps.push(now);
    if (taps.length >= 5) { taps = []; DEBUG = !DEBUG; localStorage.setItem('shear_debug', DEBUG ? '1' : '0'); popText(W / 2, H * 0.3, DEBUG ? '调试：买东西免费' : '调试关闭'); renderHud(); }
});
const isTouch = matchMedia('(pointer: coarse)').matches;
function tryFullscreen() {
    if (!isTouch || document.fullscreenElement || document.webkitFullscreenElement) return;
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    try { const r = req.call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(() => { }); } catch (e) { }
}

// ============================================================
// 主循环
// ============================================================
let last = performance.now(), snipT = 0, saveT = 0, domT = 0;
function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now; T += dt;
    advance(dt, false);
    if (scene === 'farm') {
        if (dirty) { dirty = false; renderBig(); renderCusts(); renderShop(); renderHud(); }
        domT -= dt; if (domT <= 0) { domT = 0.25; tickDom(); }
        updateHand();
        drawPasture(dt);
    } else {
        if (clip.down && A) {
            const dx = clip.x - clip.px, dy = clip.y - clip.py, dist = Math.hypot(dx, dy);
            clip.speed += ((dt > 0 ? dist / dt : 0) - clip.speed) * Math.min(1, dt * 15);
            const steps = Math.max(1, Math.ceil(dist / (clipR() * U * 0.5)));
            let n = 0;
            for (let i = 1; i <= steps; i++) n += shearAt(clip.px + dx * i / steps, clip.py + dy * i / steps, dx / Math.max(dt, 0.001), dy / Math.max(dt, 0.001));
            if (n) { clip.cutT = 0.12; snipT -= dt; if (snipT <= 0) { sfx.snip(); snipT = 0.05; } }
            clip.px = clip.x; clip.py = clip.y;
        }
        clip.cutT = Math.max(0, clip.cutT - dt); clip.jam = Math.max(0, clip.jam - dt);
        buzzLevel(clip.cutT > 0, clip.jam > 0);
        updateShear(dt); drawShearRoom(); $('hand').classList.add('hidden');
        domT -= dt; if (domT <= 0) { domT = 0.25; tickWait(); }
        if (dirty) { dirty = false; renderHud(); }
    }
    saveT += dt; if (saveT > 3) { saveT = 0; save(); }
    requestAnimationFrame(frame);
}
addEventListener('resize', () => { resize(); dirty = true; });
resize();
// 离线回来：羊照样长毛、机器照样做（最多算 2 小时）
{
    const away = Math.min(7200, (Date.now() - (S.t || Date.now())) / 1000);
    if (away > 5) {
        const log = advance(away, true);
        for (let i = 0; i < 3; i++) S.custs[i] = null;   // 客人换一批，免得一回来就全走光
        const parts = [log.sheep && `${log.sheep} 只羊长好了毛`, log.yarn && `纺了 ${log.yarn} 团毛线`, log.items && `织好 ${log.items} 件`].filter(Boolean);
        if (parts.length) setTimeout(() => popText(W / 2, H * 0.45, `离开期间：${parts.join('，')}`, 'good'), 700);
    }
}
renderGoal(); renderBig(); renderCusts(); renderShop(); renderHud(); resize();
if (!S.seen) {
    showCard(`<div class="ctop"><button class="btn" id="cGo">开店</button></div>
        <div style="font-size:44px">🐑🧶🧣</div><h2>羊毛小铺</h2>
        <div class="sub" style="text-align:left;display:inline-block;font-size:16px">
        ① 点头上有 ✂️ 的羊，<b>划动剃毛</b><br>
        ② 毛会<b>自动</b>纺线、织好、交给客人<br>
        ③ 每天营业 2 分半，<b>赚够目标</b>就过关<br>
        <span style="opacity:.8;font-size:14px">剃得越快越干净毛越多 · 客人等不及会走掉、掉口碑</span><br>
        <span style="opacity:.65;font-size:13px">👆 手指图标会告诉你下一步点哪</span></div>`);
    $('cGo').onclick = () => { S.seen = true; save(); hideCard(); };
}
requestAnimationFrame(frame);
